<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日文筆記">
<title>日文筆記查詢</title>
<style>
:root{
  --paper:#FBFAF7; --card:#FFFFFF; --ink:#1C2B3A; --soft:#63717F;
  --line:#E8E4DB; --shu:#D8442E; --shu-bg:#FBE3DE;
  --c-word:#1F8A82; --c-sent:#3B5BA5; --c-long:#B0791E; --c-gram:#7A5AA5;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--paper);color:var(--ink);}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",
   "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:0 0 max(28px,env(safe-area-inset-bottom));}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}
header{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.92);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);padding-top:max(14px,env(safe-area-inset-top));}
.kicker{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.kicker b{font-size:.98rem;font-weight:700;letter-spacing:.14em}
.kicker span{font-size:.72rem;color:var(--soft);letter-spacing:.12em}
.kicker .gear{margin-left:auto;border:0;background:none;font-size:1.1rem;color:var(--soft);cursor:pointer;padding:2px 6px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
#q{width:100%;font-size:16px;padding:14px 44px 14px 42px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;font-family:inherit}
#q:focus{border-color:var(--shu);box-shadow:0 0 0 3px var(--shu-bg)}
#clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
  font-size:20px;color:var(--soft);cursor:pointer;width:32px;height:32px;line-height:1;display:none}
.meta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 12px;font-size:.78rem;color:var(--soft)}
.count b{color:var(--shu);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--soft);
  padding:7px 14px;border-radius:999px;font-size:.82rem;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:all .12s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.star.on{background:var(--shu);border-color:var(--shu)}
main{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--radius);padding:14px 15px;position:relative}
.card.word{border-left-color:var(--c-word)}
.card.sent{border-left-color:var(--c-sent)}
.card.long{border-left-color:var(--c-long)}
.card.gram{border-left-color:var(--c-gram)}
.jp{font-size:1.28rem;font-weight:600;letter-spacing:.01em;line-height:1.5;padding-right:34px}
.zh{margin-top:5px;color:#33414f;font-size:1rem}
.note{margin-top:9px;font-size:.86rem;color:var(--soft);white-space:pre-wrap;
  border-top:1px dashed var(--line);padding-top:8px}
.tags{margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:.68rem;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:#F1EEE7;color:var(--soft)}
.tag.cat-word{background:rgba(31,138,130,.12);color:var(--c-word)}
.tag.cat-sent{background:rgba(59,91,165,.12);color:var(--c-sent)}
.tag.cat-long{background:rgba(176,121,30,.14);color:var(--c-long)}
.tag.cat-gram{background:rgba(122,90,165,.14);color:var(--c-gram)}
.tag.user{background:rgba(216,68,46,.10);color:var(--shu)}
.fav{position:absolute;top:11px;right:11px;border:0;background:none;font-size:20px;line-height:1;
  cursor:pointer;color:#CBC7BC;width:30px;height:30px}
.fav.on{color:var(--shu)}
mark{background:var(--shu-bg);color:var(--shu);font-weight:700;border-radius:3px;padding:0 1px}
.clamp .zh,.clamp .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:8px;font-size:.78rem;color:var(--shu);cursor:pointer;user-select:none;display:inline-block}
.state{text-align:center;padding:44px 22px;color:var(--soft)}
.state .big{font-size:2.1rem;margin-bottom:10px;opacity:.6}
.state p{margin:5px 0;font-size:.9rem}
.state code{background:#F1EEE7;padding:1px 6px;border-radius:5px;font-size:.82rem;word-break:break-all}
.setup{text-align:left;max-width:560px;margin:0 auto}
.setup h2{font-size:1.05rem;margin:0 0 4px;text-align:center}
.setup .lead{font-size:.82rem;color:var(--soft);text-align:center;margin-bottom:18px}
.setup label{display:block;font-size:.8rem;font-weight:700;margin:12px 0 4px}
.setup input{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;font-family:inherit}
.setup input:focus{outline:none;border-color:var(--shu);box-shadow:0 0 0 3px var(--shu-bg)}
.setup .how{font-size:.78rem;color:var(--soft);background:#F4F1EA;border-radius:10px;padding:12px 14px;margin:16px 0}
.setup .how b{color:var(--ink)}
.btn{background:var(--shu);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:.95rem;
  cursor:pointer;font-family:inherit;display:block;width:100%;margin-top:16px}
.foot{margin:22px 2px 0;font-size:.72rem;color:var(--soft);display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px;flex-wrap:wrap}
.foot .diag{flex:1 1 60%;min-width:0;line-height:1.7}
.foot .diag .warn{color:var(--shu);font-weight:700}
.foot button{border:0;background:none;color:var(--shu);cursor:pointer;font-size:.72rem;font-family:inherit;white-space:nowrap}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--shu);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation:none}}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="kicker"><b>日文筆記</b><span>NOTE INDEX · v4</span>
    <button class="gear" id="gear" title="設定連結">⚙︎</button></div>
  <div class="search">
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
   <input id="q" type="search" inputmode="search" autocomplete="off"
     placeholder="輸入日文、中文或文法…（空格分隔可多字）">
   <button id="clr" aria-label="清除">×</button>
  </div>
  <div class="chips" id="chips">
   <button class="chip on" data-c="all">全部</button>
   <button class="chip" data-c="單字片語">單字片語</button>
   <button class="chip" data-c="短句">短句練習</button>
   <button class="chip" data-c="長篇">長篇翻譯</button>
   <button class="chip" data-c="文法">文法</button>
   <button class="chip star" data-c="fav">☆ 收藏</button>
  </div>
  <div class="meta">
   <span class="count"><b id="n">0</b> 筆</span>
   <span id="hint"></span>
  </div>
 </div>
</header>
<div class="wrap"><main id="list"></main>
  <div class="foot" id="foot" style="display:none">
    <span class="diag" id="diag"></span>
    <button id="refresh">↻ 重新載入</button>
  </div>
</div>

<script>
/* 讀「發布到網路」的 CSV（完整內容、不會因空白列截斷）。
   四個分頁的 CSV 連結在設定畫面（齒輪）貼入，存在本機瀏覽器。 */
const TABS = [
  {sheet:"單字片語", cat:"單字片語"},
  {sheet:"短句練習", cat:"短句"},
  {sheet:"長篇翻譯", cat:"長篇"},
  {sheet:"文法", cat:"文法", map:{jp:"文法/句型", zh:"概念", note:["說明／例句"]}},
];
const CATCLASS={'單字片語':'word','短句':'sent','長篇':'long','文法':'gram'};
const CATTAG={'單字片語':'cat-word','短句':'cat-sent','長篇':'cat-long','文法':'cat-gram'};
const CATNAME={'單字片語':'單字片語','短句':'短句','長篇':'長篇','文法':'文法'};
const $=s=>document.querySelector(s);
const list=$('#list'), qEl=$('#q');
let DATA=[], cat='all', terms=[], favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem('jpfav')||'[]'))}catch(e){}
function saveFav(){try{localStorage.setItem('jpfav',JSON.stringify([...favs]))}catch(e){}}

// 已內建、經確認可用的四條「發布到網路」CSV 連結（可在齒輪 ⚙︎ 覆蓋）
const B="https://docs.google.com/spreadsheets/d/e/2PACX-1vT-22nnMYL-82-iuwTvbJgqMUfloszFyvM9G5auH3_vZYnsg-m6Skqw10oTUXNerZ9qrorE_ARvqCP6/pub?single=true&output=csv&gid=";
const DEFAULT_URLS={
  "單字片語": B+"165244829",
  "短句練習": B+"1815302677",
  "長篇翻譯": B+"706268185",
  "文法":     B+"705204509",
};
function getUrls(){
  let s={}; try{s=JSON.parse(localStorage.getItem('jpcsvurls')||'{}')}catch(e){}
  const o={}; TABS.forEach(t=>{o[t.sheet]=(s[t.sheet]||DEFAULT_URLS[t.sheet]||'').trim();});
  return o;
}
function setUrls(o){ try{localStorage.setItem('jpcsvurls',JSON.stringify(o))}catch(e){} }
function hasAnyUrl(){ const u=getUrls(); return TABS.some(t=>u[t.sheet]); }

/* ---- CSV 解析（支援欄位內含逗號/引號/換行）---- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else if(c==='\r'){ /* skip */ }
      else f+=c;
    }
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function colRole(h){
  h=(h||'').trim();
  if(h.includes('日文')||h.includes('正確翻譯')) return 'jp';
  if(h.includes('中文')) return 'zh';
  if(h.includes('熟練度')) return null;
  if(h.includes('來源')) return 'src';
  if(h.includes('標籤')||h.includes('主題')) return 'tag';
  if(h.includes('重點')||h.includes('備註')||h.includes('文法')) return 'note';
  return null;
}
async function fetchCsv(url){
  const u=url + (url.includes('?')?'&':'?') + 't=' + Date.now();   // 破快取
  const res=await fetch(u,{cache:'no-store'});
  const txt=await res.text();
  if(!res.ok || txt.trim().startsWith('<')) throw new Error('讀取失敗');
  return parseCSV(txt);
}
async function loadAll(){
  if(!hasAnyUrl()){ showSetup(); return; }
  showLoading();
  const urls=getUrls(); const diag=[];
  try{
    const recs=[];
    for(const cfg of TABS){
      const url=urls[cfg.sheet];
      if(!url){ diag.push(`${cfg.sheet} 未設定`); continue; }
      let rows;
      try{ rows=await fetchCsv(url); }
      catch(e){ diag.push(`${cfg.sheet} <span class="warn">⚠失敗</span>`); continue; }
      if(!rows.length){ diag.push(`${cfg.sheet} 0`); continue; }
      const hdr=rows[0].map(x=>(x||'').trim());
      const idx=h=>hdr.indexOf(h);
      const roles = cfg.map ? null : hdr.map(colRole);
      let n=0;
      for(let r=1;r<rows.length;r++){
        const cells=rows[r].map(x=>(x||'').trim());
        const rec={c:cfg.cat,jp:'',zh:'',n:'',t:'',s:cfg.sheet};
        if(cfg.map){
          const m=cfg.map;
          if(m.jp && idx(m.jp)>=0) rec.jp=cells[idx(m.jp)]||'';
          if(m.zh && idx(m.zh)>=0) rec.zh=cells[idx(m.zh)]||'';
          if(m.tag && idx(m.tag)>=0) rec.t=cells[idx(m.tag)]||'';
          const notes=[];
          (m.note||[]).forEach(h=>{const i=idx(h);
            if(i>=0 && cells[i]) notes.push(m.note.length>1 ? (h+'：'+cells[i]) : cells[i]);});
          rec.n=notes.join(' ｜ ');
        }else{
          cells.forEach((v,ci)=>{
            const role=roles[ci]; if(!role) return;
            if(role==='jp')rec.jp=v; else if(role==='zh')rec.zh=v;
            else if(role==='note')rec.n=v; else if(role==='tag')rec.t=v;
            else if(role==='src'&&v)rec.s=v;
          });
        }
        if(rec.jp||rec.zh){ recs.push(rec); n++; }
      }
      diag.push(`${cfg.sheet} ${n}`);
    }
    if(!recs.length) throw new Error('沒讀到資料');
    DATA=recs; DATA.forEach((d,i)=>d._id=i);
    $('#foot').style.display='flex';
    const t=new Date().toLocaleTimeString('zh-TW',{hour12:false});
    $('#diag').innerHTML=`已更新 ${t}　｜　`+diag.join('・');
    render();
  }catch(e){ showError(); }
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hi(s){
  let out=esc(s||'');
  for(const t of terms){ if(!t)continue;
    const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    out=out.replace(re,m=>'\u0001'+m+'\u0002');
  }
  return out.replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>');
}
function matches(d){
  if(cat==='fav'){ if(!favs.has(d._id))return false; }
  else if(cat!=='all'&&d.c!==cat) return false;
  if(!terms.length) return true;
  const hay=(d.jp+' '+d.zh+' '+d.n+' '+d.t+' '+d.s).toLowerCase();
  return terms.every(t=>hay.includes(t.toLowerCase()));
}
function card(d){
  const cls=CATCLASS[d.c], isLong=d.c==='長篇';
  const userTag=d.t?`<span class="tag user">${esc(d.t)}</span>`:'';
  return `<article class="card ${cls}${isLong?' clamp':''}" data-id="${d._id}">
    <button class="fav${favs.has(d._id)?' on':''}" data-fav>${favs.has(d._id)?'★':'☆'}</button>
    <div class="jp">${hi(d.jp||d.zh)}</div>
    ${d.jp&&d.zh?`<div class="zh">${hi(d.zh)}</div>`:''}
    ${d.n?`<div class="note">${hi(d.n)}</div>`:''}
    ${isLong?`<span class="more" data-more>展開全部 ▾</span>`:''}
    <div class="tags"><span class="tag ${CATTAG[d.c]}">${CATNAME[d.c]}</span>${userTag}<span class="tag">${esc(d.s)}</span></div>
  </article>`;
}
function render(){
  const res=DATA.filter(matches);
  $('#n').textContent=res.length;
  $('#hint').textContent = (terms.length||cat!=='all')?'':('共 '+DATA.length+' 筆');
  if(!res.length){
    list.innerHTML=`<div class="state"><div class="big">🔍</div>
      <p>${cat==='fav'?'還沒有收藏的筆記':'找不到「'+esc(qEl.value)+'」'}</p>
      <p>${cat==='fav'?'點卡片右上角 ☆ 加入收藏':'換個關鍵字試試'}</p></div>`;
    return;
  }
  list.innerHTML=res.map(card).join('');
}
function showLoading(){ list.innerHTML=`<div class="state"><div class="spin"></div><p>讀取中…</p></div>`; }
function showError(){
  list.innerHTML=`<div class="state"><div class="big">⚠️</div>
   <p>讀不到資料。請確認四個 CSV 連結是「發布到網路」產生的、而且結尾是 <code>output=csv</code>。</p>
   <p style="margin-top:14px"><button class="btn" id="reconf" style="max-width:220px;margin:0 auto">重新設定連結</button></p></div>`;
  $('#reconf').onclick=showSetup;
}
function showSetup(){
  $('#foot').style.display='none';
  const u=getUrls();
  list.innerHTML=`<div class="state"><div class="setup">
    <h2>設定分頁連結</h2>
    <p class="lead">貼上各分頁「發布到網路」的 CSV 連結（可只填有的）</p>
    <div class="how">
      取得方式：Google 試算表 →「<b>檔案 → 共用 → 發布到網路</b>」→
      左邊下拉<b>選一個分頁</b>、右邊格式選 <b>逗號分隔值 (.csv)</b> →「發布」→ <b>複製那條連結</b>。
      四個分頁各做一次貼到下面。連結長得像 <code>…/pub?gid=…&single=true&output=csv</code>。
    </div>
    <label>單字片語</label><input id="u0" placeholder="…output=csv" value="${esc(u['單字片語']||'')}">
    <label>短句練習</label><input id="u1" placeholder="…output=csv" value="${esc(u['短句練習']||'')}">
    <label>長篇翻譯</label><input id="u2" placeholder="…output=csv" value="${esc(u['長篇翻譯']||'')}">
    <label>文法</label><input id="u3" placeholder="…output=csv" value="${esc(u['文法']||'')}">
    <button class="btn" id="save">儲存並載入</button>
  </div></div>`;
  $('#save').onclick=()=>{
    const o={
      '單字片語':$('#u0').value.trim(),
      '短句練習':$('#u1').value.trim(),
      '長篇翻譯':$('#u2').value.trim(),
      '文法':$('#u3').value.trim(),
    };
    setUrls(o);
    if(TABS.some(t=>o[t.sheet])) loadAll(); else showSetup();
  };
}
/* 事件 */
let tmr;
qEl.addEventListener('input',()=>{
  $('#clr').style.display=qEl.value?'block':'none';
  clearTimeout(tmr);
  tmr=setTimeout(()=>{terms=qEl.value.trim().split(/\s+/).filter(Boolean);render()},80);
});
$('#clr').addEventListener('click',()=>{qEl.value='';terms=[];$('#clr').style.display='none';render();qEl.focus()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  cat=b.dataset.c;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render();});
list.addEventListener('click',e=>{
  const fb=e.target.closest('[data-fav]');
  if(fb){const id=+fb.closest('.card').dataset.id;
    favs.has(id)?favs.delete(id):favs.add(id); saveFav();
    if(cat==='fav')render();
    else{fb.classList.toggle('on',favs.has(id));fb.textContent=favs.has(id)?'★':'☆'} return;}
  const mb=e.target.closest('[data-more]');
  if(mb){const c=mb.closest('.card');c.classList.toggle('clamp');
    mb.textContent=c.classList.contains('clamp')?'展開全部 ▾':'收合 ▴';}
});
$('#gear').onclick=showSetup;
$('#refresh').onclick=loadAll;
loadAll();
</script>
</body>
</html>
